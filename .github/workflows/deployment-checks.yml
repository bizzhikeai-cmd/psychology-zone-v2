name: Deployment Safety Checks

on:
  pull_request:
    branches:
      - main  # Only run on PRs to production branch

jobs:
  deployment-checks:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Validate environment variable format
        run: |
          echo "✓ Checking .env.example format..."
          node scripts/validate-env.cjs .env.example
        continue-on-error: false

      - name: 🏗️ Build verification
        run: |
          echo "✓ Testing production build..."
          npm run build
        env:
          # Provide dummy env vars for build (real ones are in Vercel)
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bW15IiwiYXVkIjoiYXV0aGVudGljYXRlZCIsImV4cCI6OTk5OTk5OTk5OX0.dummy
          SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bW15IiwiYXVkIjoic2VydmljZV9yb2xlIiwiZXhwIjo5OTk5OTk5OTk5fQ.dummy
          RESEND_API_KEY: re_dummy_key_for_build
          RAZORPAY_KEY_ID: rzp_test_dummy
          RAZORPAY_KEY_SECRET: dummy_secret_key_for_build_only
          ADMIN_PASSWORD: dummy_password_for_build
          ADMIN_EMAIL: admin@example.com
          INTERAKT_API_KEY: dummy_interakt_key
          SITE_URL: https://book.psychologyzone.in

      - name: 🔎 TypeScript type checking
        run: npx astro check
        continue-on-error: true  # Don't fail build on type errors, just warn

      - name: 🔒 Security audit
        run: |
          echo "✓ Checking for critical vulnerabilities..."
          npm audit --audit-level=critical
        continue-on-error: true  # Warn but don't block deployment

      - name: 📊 Check bundle size
        run: |
          echo "✓ Analyzing build output..."
          du -sh dist/ || echo "Build size check skipped"
          echo "Build completed successfully!"

      - name: ✅ All checks passed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment Safety Checks Passed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✓ Environment variables validated"
          echo "✓ Build successful"
          echo "✓ TypeScript checked"
          echo "✓ Security audit complete"
          echo ""
          echo "✨ Safe to deploy to production!"
